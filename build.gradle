plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.7-SNAPSHOT" apply false
   // id 'io.github.juuxel.loom-quiltflower' version '1.7.1' apply false
    id "me.modmuss50.mod-publish-plugin" version "0.8.+" apply false
    id "com.modrinth.minotaur" version "2.+"
}

architectury {

    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
  //  apply plugin: "io.github.juuxel.loom-quiltflower"
    apply plugin: "me.modmuss50.mod-publish-plugin"
    apply plugin: "com.modrinth.minotaur"


    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {

            it.officialMojangMappings {
                setNameSyntheticMembers(false)
            }
            it.parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}")
        }
    }

    var env = System.getenv()
    var modLoader = name

    var changelogFile = rootProject.file("changelog.md")
    var changelogText = changelogFile.exists() ? changelogFile.text : ""

    if (env.MODRINTH_TOKEN) {
        modrinth {
            projectId = "just-enough-effect-descriptions-jeed"
            uploadFile = tasks.remapJar
            gameVersions = [rootProject.minecraft_version]
            loaders = [modLoader]
            changelog = changelogText

            if (modLoader == "fabric") {
                dependencies {
                    required.project "fabric-api"
                    optional.project "jei"
                    optional.project "emi"
                    optional.project "rei"
                    optional.project "stylish-effects"
                }
            } else {
                dependencies {
                    optional.project "jei"
                    optional.project "rei"
                    optional.project "emi"
                    optional.project "stylish-effects"
                }
            }
        }
    }

    if (env.CURSEFORGE_TOKEN) {
        publishMods {
            file = tasks.remapJar.archiveFile
            changelog = changelogText
            displayName = "${rootProject.mod_id}-${rootProject.mod_version}-${modLoader}"
            type = STABLE
            modLoaders.add(modLoader)

            curseforge {
                projectId = rootProject.project_id
                accessToken = env.CURSEFORGE_TOKEN
                minecraftVersions.add(rootProject.minecraft_version)
                clientRequired = true
                serverRequired = false

                if (modLoader == "fabric") {
                    requires { slug = "fabric-api" }
                }
                optional { slug = "jei" }
                optional { slug = "emi" }
                optional { slug = "roughly-enough-items" }
                optional { slug = "stylish-effects" }
            }
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.mod_id
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {

        flatDir {
            dirs 'mods'
        }

        mavenLocal()

        maven { url "https://maven.shedaniel.me" }

        maven { url "https://maven.parchmentmc.org" }

        maven {
            url = "https://www.cursemaven.com"
            allowInsecureProtocol = true
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            name = 'Ladysnake Mods'
            url = 'https://maven.ladysnake.org/releases'
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}
